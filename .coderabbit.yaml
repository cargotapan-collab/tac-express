# CodeRabbit configuration — tac-express
# https://docs.coderabbit.ai/guides/configure-coderabbit
#
# Tunes CodeRabbit for the TAC Express monorepo:
#   - Surface review focus on the design system / Fourteen Laws
#   - Skip generated / vendored content (lockfiles, generated DB types)
#   - Defer audit-script paths to humans (they're meta-tooling)
#   - Honor the project's existing skill files for context

language: en-US
tone_instructions: >-
  Be precise and technical. Reference the Fourteen Laws (PROJECT-RULES.md)
  and the Violet Grid v6 spec (docs/VIOLET-GRID-V6-EVOLUTION.md) when
  relevant. Skip stylistic nits in markdown / commit messages.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  # Auto-review behavior
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Path-level overrides
  path_filters:
    # Skip lockfiles + generated assets
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/.turbo/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/node_modules/**"
    # Skip generated DB types — they come from Supabase CLI, not human-authored
    - "!packages/database/src/database.types.ts"

  path_instructions:
    - path: "packages/ui/src/styles/globals.css"
      instructions: >-
        Source of truth for ALL design tokens (LAW 1). Any new colors must be
        OKLCH and live here, not in components. Verify additions follow the
        v6 token namespaces (--surface-*, --overlay-*, --motion-*).

    - path: "packages/ui/src/components/**/*.tsx"
      instructions: >-
        UI components must (a) live in packages/ui (LAW 5), (b) use semantic
        tokens not Tailwind color classes (LAW 10), (c) avoid arbitrary
        Tailwind values like w-[347px] (LAW 11), (d) use CVA variants and
        data-slot attributes, (e) use @workspace/ui/icons for Remix Icon
        imports (LAW 2).

    - path: "packages/services/src/**/*.ts"
      instructions: >-
        Business logic only. No React components. Service factories take a
        SupabaseClient and return typed methods. Inputs should use
        TablesInsert<> from @workspace/database/database.types where
        possible. No @supabase/supabase-js imports outside packages/database
        (LAW 8).

    - path: "apps/**/*.{ts,tsx}"
      instructions: >-
        App layer must NOT contain UI components (LAW 5) — those go in
        packages/ui. App layer must NOT contain business logic (LAW 7) —
        that goes in packages/services. App layer routes Supabase access
        via @workspace/database (LAW 8).

    - path: "supabase/functions/**/*.ts"
      instructions: >-
        Deno edge functions. Imports from "jsr:@supabase/supabase-js@2"
        or "https://esm.sh/" are EXPECTED — these are the only files
        exempt from LAW 8 (audit-governance.mjs already exempts them).

    - path: "scripts/audit-*.{mjs,ts}"
      instructions: >-
        Governance audit scripts. Be cautious — these enforce the
        Fourteen Laws on the rest of the repo. Changes here should be
        reviewed by a human, but flag obvious bugs.

  # Review tools
  tools:
    eslint:
      enabled: true
    biome:
      enabled: false
    shellcheck:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
