# Playwright visual regression + accessibility audit on every PR + push to main.
#
# Two suites:
#   - apps/dashboard/e2e/visual.spec.ts → pixel diffs of every key route at
#     1280 + 1920 viewports. Fails if any diff exceeds 1.5% of pixels.
#   - apps/dashboard/e2e/a11y.spec.ts → axe-core WCAG 2.1 AA scan per route.
#     With AXE_FAIL_ON_VIOLATIONS=1, any serious/critical violation fails.
#
# The HTML report is uploaded as an artifact so reviewers can click through
# diffs even when running in CI.

name: e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/ui/**"
      - "packages/services/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

# Cancel in-flight runs on the same PR when a new push lands.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: visual + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail the build on any serious/critical axe violation. Locally we keep
      # this off so developers see findings without being blocked; in CI we
      # gate.
      AXE_FAIL_ON_VIOLATIONS: "1"
      # Supabase + env vars the dev server needs to boot. Provide via repo
      # secrets so the auth + data flows can actually run.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E2E credentials unlock the 7 protected-route tests. If unset, those
      # specs skip automatically (the suite stays green on public surfaces).
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup@v4 reads the version from
      # the workspace's `packageManager` field (pnpm@10.33.3) and errors
      # if both are specified (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm --filter dashboard exec playwright install --with-deps chromium

      - name: Build dashboard
        run: pnpm --filter dashboard build

      - name: Start dashboard
        run: pnpm --filter dashboard start &
        env:
          PORT: "3001"

      - name: Wait for dashboard to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/sign-in > /dev/null; then
              echo "Dashboard is up"
              exit 0
            fi
            sleep 1
          done
          echo "Dashboard failed to start within 60s"
          exit 1

      - name: Run Playwright e2e suite
        run: pnpm --filter dashboard exec playwright test --config=playwright.config.ts
        env:
          # Force a deterministic snapshot environment.
          TZ: UTC

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 14

      - name: Upload visual diffs (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/dashboard/test-results/
          retention-days: 14
